<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טוען כתבה... | yhsh</title>
    <!-- Google Fonts: Heebo & Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Dark Top Header Bar -->
    <header class="top-navbar-dark">
        <div class="container top-nav-container">
            
            <!-- Right: Logo "yhsh" -->
            <div class="nav-right">
                <a href="index.html" class="brand-infinity">
                    <span class="brand-logo-badge">
                        <span class="logo-txt-white">yh</span><span class="logo-box-black">sh</span>
                    </span>
                </a>
            </div>

            <!-- Center: Navigation Tab - Single "ראשי" tab -->
            <nav class="nav-center-tabs">
                <a href="index.html" class="nav-tab active">
                    <i class="fa-solid fa-house"></i>
                    <span>ראשי</span>
                </a>
            </nav>

            <!-- Left: Actions & Guest Pill -->
            <div class="nav-left">
                <button id="themeToggle" class="btn-top-icon" title="החלף מצב תצוגה">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div class="guest-pill">
                    <span>אורח</span>
                </div>
                <div class="infinity-icon-edge">
                    <i class="fa-solid fa-infinity"></i>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Full Article View Container -->
    <main class="main-content container">
        <div id="articlePageContainer" class="article-page-box">
            <!-- Article Details Injected via JS -->
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p>טוען את הכתבה...</p>
            </div>
        </div>

        <!-- Related Articles Section -->
        <section class="related-section">
            <h3 class="section-title">כתבות נוספות שאינך רוצה לפספס</h3>
            <div id="relatedGrid" class="top3-grid" style="margin-top: 15px;">
                <!-- Related Cards injected via JS -->
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span id="toastMessage">הפעולה בוצעה בהצלחה</span>
    </div>

    <script src="article.js"></script>
</body>
</html>
