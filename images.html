<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גלריית התמונות | עמוד התמונות</title>
    <!-- Google Fonts: Heebo & Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=4000">
</head>
<body>

    <!-- Header Bar -->
    <header class="apple-nav">
        <div class="apple-nav-content">
            <div class="nav-left">
                <button class="btn-publish-nav-btn" onclick="window.location.href='index.html'">עמוד הבית</button>
                <button id="manager-btn" class="guest-pill-btn" onclick="showGuestToast()">אורח</button>
            </div>

            <nav class="nav-links">
                <a href="index.html">סיפורים</a>
            </nav>

            <div class="logo-area" onclick="window.location.href='index.html'" style="cursor: pointer;" title="לוגו האתר">
                <span class="brand-logo-badge">PROPILE</span>
            </div>
        </div>
    </header>

    <!-- Page Body Wrapper -->
    <div class="page-layout-wrapper">

        <!-- Left Sidebar Column -->
        <aside class="sidebar-column sidebar-left">
            <div class="sidebar-card">
                <div class="sidebar-card-title">אתרים מומלצים</div>
                <div class="recommended-sites-list">
                    <a href="popular.html" class="site-link-btn">
                        <i class="fa-solid fa-star" style="color: #f59e0b;"></i>
                        <span>כל האתרים הפופולריים 🇮🇱</span>
                    </a>
                    <a href="carpool.html" class="site-link-btn">
                        <i class="fa-solid fa-car" style="color: #16a34a;"></i>
                        <span>נסיעה שיתופית 🚘</span>
                    </a>
                    <a href="https://youtube.com" target="_blank" class="site-link-btn">
                        <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
                        <span>יוטיוב (YouTube)</span>
                    </a>
                </div>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-card-title">הסיפורים הנקראים ביותר</div>
                <div id="topReadStoriesLeft" class="top-read-list">
                    <!-- Dynamic list loaded via JS -->
                </div>
            </div>
        </aside>

        <!-- Main Center Column -->
        <main class="main-center-column">
            
            <div class="section-sub-header">
                <h2 class="section-title-text">🖼️ גלריית תמונות בלבד (HD Images)</h2>
                <div class="search-filter-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="imagesSearchInput" placeholder="חפש תמונות ונושאים..." oninput="handleImagesSearch(this.value)">
                </div>
            </div>

            <!-- Images Only Grid -->
            <div id="imagesGridContainer" class="articles-cards-grid">
                <!-- Rendered via images.js -->
            </div>

        </main>

        <!-- Right Sidebar Column -->
        <aside class="sidebar-column sidebar-right">
            <div class="sidebar-card">
                <div class="sidebar-card-title">אתרים מומלצים</div>
                <div class="recommended-sites-list">
                    <a href="popular.html" class="site-link-btn">
                        <i class="fa-solid fa-star" style="color: #f59e0b;"></i>
                        <span>אינדקס אתרים פופולריים 🇮🇱</span>
                    </a>
                    <a href="professionals.html" class="site-link-btn">
                        <i class="fa-solid fa-user-tie" style="color: #2563eb;"></i>
                        <span>חיפוש אנשי מקצוע 🛠️</span>
                    </a>
                </div>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-card-title">הסיפורים הנקראים ביותר</div>
                <div id="topReadStoriesRight" class="top-read-list">
                    <!-- Dynamic list loaded via JS -->
                </div>
            </div>
        </aside>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage">הפעולה בוצעה בהצלחה</span>
    </div>

    <script src="images.js"></script>
</body>
</html>
