<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yhsh | סיעורים - לוח הצעות מחיר בלייב</title>
    <!-- Google Fonts: Heebo & Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=1100">
</head>
<body>

    <!-- Header Bar Exactly Matching User Screenshot -->
    <header class="top-navbar-white">
        <div class="container top-nav-container">
            
            <!-- Right: Infinity Logo (♾️) -->
            <div class="nav-right">
                <a href="index.html" class="brand-infinity">
                    <span class="brand-text-yad2">
                        <span class="brand-sh-badge"><i class="fa-solid fa-infinity"></i></span>
                    </span>
                </a>
            </div>

            <!-- Center: Navigation Tabs -->
            <nav class="nav-center-tabs">
                <a href="index.html" class="nav-tab">
                    <i class="fa-regular fa-image"></i>
                    <span>תמונות</span>
                </a>

                <a href="trading.html" class="nav-tab pill-tab">
                    <span>סיעורים</span>
                </a>

                <a href="add-listing.html" class="nav-tab">
                    <i class="fa-solid fa-plus"></i>
                    <span>פרסום מודעה</span>
                </a>

                <a href="couriers.html" class="nav-tab">
                    <i class="fa-solid fa-motorcycle"></i>
                    <span>שליחים</span>
                </a>
            </nav>

            <!-- Left: Actions & Guest Pill at VERY FAR LEFT -->
            <div class="nav-left">
                <div class="user-balance-pill" title="היתרה שלך">
                    <i class="fa-solid fa-wallet"></i>
                    <span id="userBalanceDisplay">₪ 50,000</span>
                </div>

                <button class="btn-favorites-pink" onclick="window.location.href='index.html'" title="חזרה לציוד">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>חזרה לציוד</span>
                </button>

                <button id="themeToggle" class="btn-top-icon" title="החלף מצב תצוגה">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <div class="guest-pill" id="guestUserPill" title="חשבון משתמש">
                    <span id="guestUserText">אורח</span>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content container">
        
        <!-- Premium Hero Wallet Section -->
        <section class="trading-hero" style="margin-bottom: 25px;">
            <div class="trading-hero-card" style="background: var(--card-bg); border-radius: var(--radius-md); padding: 22px 28px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 20px;">
                <div class="hero-wallet" style="display: flex; align-items: center; gap: 16px;">
                    <div style="width: 54px; height: 54px; border-radius: 50%; background: #18181b; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                        <i class="fa-solid fa-gavel"></i>
                    </div>
                    <div>
                        <h2 style="font-size: 1.4rem; font-weight: 900; color: var(--text-primary);">סיעורים - לוח הצעות מחיר בלייב</h2>
                        <p style="color: var(--text-muted); font-size: 0.92rem;">ניהול הצעות מחיר שקיבלת על המוצרים שלך והצעות שהגשת מול משכירים אחרים</p>
                    </div>
                </div>

                <div class="wallet-balance-box" style="text-align: left; display: flex; flex-direction: column; align-items: flex-end;">
                    <span class="balance-label" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">יתרה פנויה בארנק:</span>
                    <span id="heroBalanceText" class="balance-amount" style="font-size: 1.6rem; font-weight: 900; color: var(--text-primary);">₪ 50,000</span>
                    <button class="btn-add-listing-pink" onclick="addFunds()" style="margin-top: 6px; font-size: 0.82rem; padding: 4px 12px;">
                        <i class="fa-solid fa-plus-circle"></i> טען ₪10,000 לארנק
                    </button>
                </div>
            </div>
        </section>

        <!-- Bids Feed Section Header -->
        <div class="main-column" style="padding: 24px;">
            <div class="section-header" style="flex-wrap: wrap; gap: 15px;">
                <h2 class="section-title"><i class="fa-solid fa-gavel"></i> הצעות מחיר וסיעורים בלייב</h2>
                
                <!-- 3 Filter Tabs for Bids ("הצעות שאני הצעתי" & "הצעות שהציעו לי") -->
                <div class="filter-bids-group" style="display: flex; gap: 8px;">
                    <button id="filterAllBids" class="nav-tab pill-tab" onclick="filterBids('all')" style="font-size: 0.88rem; padding: 6px 14px;">
                        🌐 כל ההצעות באתר
                    </button>
                    <button id="filterOutgoingBids" class="nav-tab" onclick="filterBids('outgoing')" style="font-size: 0.88rem; padding: 6px 14px;">
                        📤 הצעות שאני הצעתי
                    </button>
                    <button id="filterIncomingBids" class="nav-tab" onclick="filterBids('incoming')" style="font-size: 0.88rem; padding: 6px 14px;">
                        📥 הצעות שהציעו לי על מוצרים שלי
                    </button>
                </div>
            </div>

            <!-- 5-Column Symmetrical Grid Container for Bids ("חמש על חמש סימטרי") -->
            <div id="bidsFeedList" class="cube-cards-grid">
                <!-- Injected via trading.js -->
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span id="toastMessage">הפעולה בוצעה בהצלחה</span>
    </div>

    <script src="trading.js"></script>
</body>
</html>
