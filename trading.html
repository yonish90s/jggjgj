<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yhsh | עמוד מסחר והצעות השכרה בלייב</title>
    <!-- Google Fonts: Heebo & Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=600">
</head>
<body>

    <!-- Header Bar Exactly Matching User Screenshot -->
    <header class="top-navbar-white">
        <div class="container top-nav-container">
            
            <!-- Right: Infinity Logo (♾️) -->
            <div class="nav-right">
                <a href="index.html" class="brand-infinity">
                    <span class="brand-text-yad2">
                        <span class="brand-sh-badge"><i class="fa-solid fa-infinity"></i></span>
                    </span>
                </a>
            </div>

            <!-- Center: Navigation Tabs -->
            <nav class="nav-center-tabs">
                <a href="index.html" class="nav-tab">
                    <i class="fa-regular fa-image"></i>
                    <span>תמונות</span>
                </a>

                <a href="trading.html" class="nav-tab pill-tab">
                    <span>סיעורים</span>
                </a>
            </nav>

            <!-- Left: Actions & Guest Pill at VERY FAR LEFT (משמאל להחלפת הבהירות) -->
            <div class="nav-left">
                <!-- User Balance Pill -->
                <div class="user-balance-pill" title="היתרה שלך">
                    <i class="fa-solid fa-wallet"></i>
                    <span id="userBalanceDisplay">₪ 50,000</span>
                </div>

                <button class="btn-favorites-pink" onclick="window.location.href='index.html'" title="חזרה לציוד">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>חזרה לציוד</span>
                </button>

                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="btn-top-icon" title="החלף מצב תצוגה">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <!-- VERY FAR LEFT: Guest Pill (משמאל להחלפת הבהירות) -->
                <div class="guest-pill" id="guestUserPill" title="חשבון משתמש">
                    <span id="guestUserText">אורח</span>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content container" style="max-width: 1100px;">
        
        <!-- Premium Hero Wallet Section -->
        <section class="trading-hero" style="margin-bottom: 30px;">
            <div class="trading-hero-card">
                <div class="hero-wallet">
                    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--primary-light); border: 2px solid var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--primary-color);">
                        <i class="fa-solid fa-gavel"></i>
                    </div>
                    <div>
                        <h2>ארנק מסחר וביטחון הצעות</h2>
                        <p>הגש הצעות מחיר בלייב על ציוד ומוצרים להשכרה מפרטיים ברמת ביטחון מלאה</p>
                    </div>
                </div>

                <div class="wallet-balance-box">
                    <span class="balance-label">יתרה פנויה בארנק:</span>
                    <span id="heroBalanceText" class="balance-amount">₪ 50,000</span>
                    <button class="btn-add-listing-pink" onclick="addFunds()" style="margin-top: 8px; font-size: 0.85rem; padding: 4px 14px;">
                        <i class="fa-solid fa-plus-circle"></i> טען ₪10,000 לארנק
                    </button>
                </div>
            </div>
        </section>

        <!-- Bids Feed Section Header -->
        <div class="main-column" style="padding: 28px;">
            <div class="section-header">
                <h2 class="section-title"><i class="fa-solid fa-chart-line"></i> לוח הצעות מחיר פעילות בלייב</h2>
                <div class="filter-bids-group">
                    <button id="filterAllBids" class="btn btn-primary" onclick="filterBids('all')">כל ההצעות באתר</button>
                    <button id="filterMyBids" class="btn btn-outline" onclick="filterBids('my')">ההצעות שלי בלבד</button>
                </div>
            </div>

            <!-- Bids Feed Render Container -->
            <div id="bidsFeedList">
                <!-- Injected via trading.js -->
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span id="toastMessage">הפעולה בוצעה בהצלחה</span>
    </div>

    <script src="trading.js"></script>
</body>
</html>
